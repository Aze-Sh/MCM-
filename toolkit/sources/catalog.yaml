    source_type: repository
    authority_level: C
    read_status: partial-read
    access_status: public
    license_status: review-required
    access_date: "2026-08-11"
    coverage: Public README, root structure, activity evidence, tests, and visible license status reviewed; code correctness is not assumed.
    repository_targets: []
    evidence_locations: []

