    repository_targets: []
    evidence_locations: []
  data: &data
    source_type: data
    authority_level: A
    read_status: partial-read
    access_status: public
    license_status: official-terms
    access_date: "2026-08-11"
    coverage: Access path, query model, attribution, and competition-use caveats reviewed; individual datasets require a fresh audit.
    repository_targets: []
    evidence_locations: []
